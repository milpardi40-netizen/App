name: Build MiloMultilang Android APK

on:
  workflow_dispatch:
    inputs:
      russian_only:
        description: 'Build only the Russian learner APK (MiloRussian.apk) and publish it as a release'
        type: boolean
        default: false
      learner_login:
        description: 'Explicitly build an additional login-enabled learner APK'
        type: boolean
        default: false
  push:
    branches:
      - arena/b2da2695-app1
      - arena/5fd5cd5d-app1
      - arena/9ecb1f7a-app2
      - arena/8366eeeb-app2
      - arena/8290df12-app2

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_LEARNER_LOGIN: "false"
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_RUSSIAN_ONLY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.russian_only) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[russian-apk]'))) && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load and validate public Supabase app settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          let parsedUrl;
          try { parsedUrl = new URL(url); } catch {}
          if (!parsedUrl || parsedUrl.protocol !== 'https:' || parsedUrl.hostname.includes('example.com') || url.toLowerCase().includes('placeholder')) {
            throw new Error('Public Supabase app URL is missing or invalid.');
          }
          if (!key || key.toLowerCase().includes('placeholder') || key.includes('your-anon-key')) {
            throw new Error('Public Supabase app key is missing or invalid.');
          }
          if (key.startsWith('sb_secret_')) throw new Error('A secret Supabase key cannot be bundled in the app.');
          if (key.startsWith('eyJ')) {
            let payload;
            try { payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()); }
            catch { throw new Error('The public Supabase key is not a valid JWT.'); }
            if (payload.role !== 'anon') throw new Error('Only a public anon key may be bundled in the app.');
          }
          if (url.includes(String.fromCharCode(10)) || key.includes(String.fromCharCode(10))) {
            throw new Error('Supabase settings must be single-line values.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - name: Validate learner OTP, language entry and accessibility
        env:
          # This regression suite exercises all six stores, independently of the release flavor.
          EXPO_PUBLIC_RUSSIAN_ONLY: 'false'
        run: |
          npm run typecheck
          npm run validate:hygiene
          npm run validate:registration-admin
          npm run validate:narration
          npm run validate:assessment
          npm run validate:progress
          npm run validate:language-entry
          npm run validate:personal-sync
          node scripts/verify-app-resume.cjs
          npm run validate:a11y
          npm run validate:requested-updates

      - name: Verify curriculum and reserve the dedicated Russian build
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run validate:russian
          node scripts/verify-russian-redesign.cjs
          node scripts/verify-russian-speech-flow.cjs
          node scripts/verify-nonenglish-restart.cjs
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/milo-russian-")
          previous=$(jq -rs '[.[][] | .ref | capture("^refs/tags/milo-russian-(?<n>[0-9]+)$").n | tonumber] | max // 0' <<< "$tags")
          (( GITHUB_RUN_NUMBER > previous )) || { echo 'Refusing to overwrite a published Russian build'; exit 1; }
          if (( previous > 0 )); then echo "PREVIOUS_RUSSIAN_TAG=milo-russian-$previous" >> "$GITHUB_ENV"; fi
          echo "MILO_VERSION_CODE=$((116 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo 'EXPO_PUBLIC_LANGUAGE_SCOPE=ru' >> "$GITHUB_ENV"
          echo 'MILO_ANDROID_ABIS=armeabi-v7a,arm64-v8a,x86,x86_64' >> "$GITHUB_ENV"
          echo 'NODE_OPTIONS=--max-old-space-size=8192' >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify and preserve the learner APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
          if 'AndroidManifest.xml' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('APK structure validation failed.')
          if 'assets/index.android.bundle' not in names:
              raise SystemExit('Standalone JS bundle is missing; refusing to publish an APK that needs Metro.')
          print('Standalone learner APK verified.')
          PY
          cp android/app/build/outputs/apk/release/app-release.apk MiloMultilang.apk

      - name: Generate and build the private management APK
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk MiloAdmin.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('MiloAdmin.apk') as archive:
              names = set(archive.namelist())
          if 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Management APK structure validation failed.')
          print('Standalone private management APK verified.')
          PY

      - name: Generate and build the learner login APK
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' && github.event_name == 'workflow_dispatch' && inputs.learner_login }}
        shell: bash
        run: |
          rm -rf android
          EXPO_PUBLIC_LEARNER_LOGIN=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          EXPO_PUBLIC_LEARNER_LOGIN=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk MiloMultilang-Login.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('MiloMultilang-Login.apk') as archive:
              names = set(archive.namelist())
          if 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Login APK structure validation failed.')
          print('Learner login APK verified.')
          PY

      - name: Smoke-test both APKs on Android emulator
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Upload Android emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/milomultilang-emulator-smoke.log
            ${{ runner.temp }}/milomultilang-emulator-window.xml
            ${{ runner.temp }}/milomultilang-emulator-screen.png
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm both release APKs are ready
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') }}
        run: test -s MiloMultilang.apk && (test '${{ env.EXPO_PUBLIC_RUSSIAN_ONLY }}' = 'true' || test -s MiloAdmin.apk)

      - name: Publish direct APK downloads
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milomultilang-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "MiloMultilang Android build #${{ github.run_number }}"
          body: Installable learner (no login) and private management Android APKs. Both are signed for sideloading.
          prerelease: true
          files: |
            MiloMultilang.apk
            MiloAdmin.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Inspect the signed Russian-only artifact
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp MiloMultilang.apk MiloRussian.apk
          python3 .github/scripts/verify-russian-apk.py
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch only the Russian APK
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/smoke-russian-apk.sh

      - name: Publish Russian-only APK release
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-russian-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Russian · 1.0.${{ env.MILO_VERSION_CODE }}"
          body_path: russian-release.md
          prerelease: true
          files: |
            MiloRussian.apk
            MiloRussian.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Register only the Russian package when in-app publishing is configured
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          tag=milo-russian-$GITHUB_RUN_NUMBER
          if [[ -n "$SERVICE_KEY" ]]; then
            url=${SUPABASE_URL:-$(node -p "require('./config/supabase.public.json').EXPO_PUBLIC_SUPABASE_URL")}
            row=$(jq -n --argjson code "$MILO_VERSION_CODE" --arg sha "$(cut -d' ' -f1 MiloRussian.apk.sha256)" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/MiloRussian.apk" --argjson size "$(stat -c %s MiloRussian.apk)" \
              '{package_name:"com.devicecontrol.milorussian",platform:"android",version_name:("1.0."+($code|tostring)),version_code:$code,download_url:$url,file_size:$size,sha256:$sha,release_notes:"درس‌های آغازین، فعل و ضمیر و مکالمهٔ نوبتی روسی",published:true,mandatory:false}')
            curl --silent --show-error --fail -o /dev/null -X POST "$url/rest/v1/app_releases?on_conflict=package_name,platform,version_code" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H 'Content-Type: application/json' \
              -H 'Prefer: resolution=merge-duplicates,return=minimal' --data "$row"
            echo 'In-app update registered for com.devicecontrol.milorussian only.' >> russian-release.md
          else
            echo 'Direct APK download; in-app update was not automatically registered.' >> russian-release.md
          fi
          gh release edit "$tag" --notes-file russian-release.md

      - name: Upload Russian-only APK artifact
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-russian-apk
          path: MiloRussian.apk
          if-no-files-found: error
          retention-days: 7

      # Informational only: prints where the megabytes went for each APK built.
      - name: Report APK composition
        if: always()
        run: |
          for apk in MiloMultilang.apk MiloAdmin.apk MiloMultilang-Login.apk MiloRussian.apk; do
            if [ -s "$apk" ]; then node scripts/apk-report.mjs "$apk" || true; fi
          done

      - name: Upload APK artifacts
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-android-apks
          path: |
            MiloMultilang.apk
            MiloMultilang-Login.apk
            MiloAdmin.apk
          if-no-files-found: error
          retention-days: 7
